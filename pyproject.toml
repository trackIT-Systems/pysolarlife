[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarlife"
authors = [
  {name = "subDesTagesMitExtraKaese"},
  {name = "Jonas Höchst", email = "hoechst@trackit.systems"}
]
version = "0.3.0"
description = "Python library for reading Solarlife MPPT solar charge controllers over BLE"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
]

[project.urls]
Repository = "https://github.com/trackIT-Systems/pysolarlife"

[project.scripts]
solarlife = "solarlife.cli:main"

[tool.setuptools.packages.find]
include = ["solarlife*"]
