[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarlife"
authors = [
  {name = "subDesTagesMitExtraKaese"},
  {name = "Jonas Höchst", email = "hoechst@trackit.systems"}
]
dynamic = ["version"]
description = "Daemon and CLI for reading SolarLife MPPT solar charge controllers over BLE"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "bleak>=0.22",
    "cbor2",
    "paho-mqtt>=2",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Repository = "https://github.com/trackIT-Systems/pysolarlife"

[project.scripts]
solarlife = "solarlife.cli:main"
solarlifed = "solarlife.daemon:main"

[tool.setuptools.dynamic]
version = {attr = "solarlife.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
