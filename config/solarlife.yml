ble:
  # adapter: hci0
  # address: "10:23:81:1E:97:4C"   # pin a device (disables RSSI selection and switching)
  scan_duration_s: 10
  search_interval_s: 60       # scan cadence while no device is found
  rescan_interval_s: 3600     # rescan cadence while connected
  switch_hysteresis_db: 10    # a rescan must find a device this much stronger to switch
  adv_max_age_s: 20           # only connect with an advertisement younger than this
  connect_timeout_s: 15
  backoff_initial_s: 2
  backoff_max_s: 120
  inprogress_min_s: 5
  stable_after_s: 60          # the backoff resets after a link stayed up this long
  max_connect_failures: 10    # per address before scanning and selecting again
  request_timeout_s: 2
  request_attempts: 3

polling:
  status_interval_s: 60
  parameters_interval_s: 3600
  reconnect_after_failures: 3
  stale_after_factor: 3

daemon:
  socket: /run/solarlife/solarlife.sock
  socket_mode: "0660"   # octal
  log_level: INFO
  csv:
    enabled: true
    path: /data
  mqtt:
    enabled: true
    host: localhost
    port: 1883
    qos: 0
    json: true
    cbor: true
